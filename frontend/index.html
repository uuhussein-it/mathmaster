<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>QuestLearn · Math &amp; SAT Practice</title>
  <meta name="description" content="Gamified practice and quizzes for Grades 9–12 math and SAT preparation." />
  <meta name="theme-color" content="#0a0f1f" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Persistent player HUD (hidden until a hero is chosen) -->
  <header id="hud" class="hud" hidden></header>

  <!-- Each screen renders into #app -->
  <main id="app" class="app" tabindex="-1"></main>

  <!-- Toasts for skill triggers, level ups, etc. -->
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <noscript>QuestLearn needs JavaScript enabled to run.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
