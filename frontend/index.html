<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math with Mr. Hussein</title>
<style>
:root{--bg:#0f1026;--card:#1a1f36;--text:#e6e7ea;--sub:#a3a8c2;--primary:#4f9deb;--success:#22c55e;--danger:#ef4444;--border:#2a2f4f}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(135deg,#0f1026 0%,#16182c 100%);color:var(--text);line-height:1.6}
nav{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:rgba(26,31,54,.8);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
nav .brand{font-weight:800;font-size:18px}
nav .navbtn{background:transparent;color:var(--text);border:1px solid var(--border);padding:8px 12px;border-radius:8px;cursor:pointer}
.container{max-width:1100px;margin:0 auto;padding:24px}
.hero{text-align:center;margin:40px 0}
.hero h1{font-size:32px;margin:0 0 8px}
.hero p{color:var(--sub);margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:32px 0}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;cursor:pointer;transition:transform .2s,box-shadow .2s;text-align:center}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(79,157,235,.25)}
.card h2{margin:8px 0 0;font-size:20px}
.card .icon{font-size:40px}
.hidden{display:none}
.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin:16px 0}
.row{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0}
.btn{background:var(--primary);color:#fff;border:none;padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:600}
.btn.secondary{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn.danger{background:var(--danger)}
.small{color:var(--sub);font-size:14px}
.qcard{max-width:800px;margin:0 auto}
.opts{display:flex;flex-direction:column;gap:10px;margin:16px 0}
.opt{background:transparent;color:var(--text);border:1px solid var(--border);padding:12px;border-radius:10px;cursor:pointer;text-align:left;display:flex;gap:10px;align-items:flex-start}
.opt.selected{border-color:var(--primary);background:rgba(79,157,235,.15)}
.opt.correct{border-color:var(--success);background:rgba(34,197,94,.15)}
.opt.wrong{border-color:var(--danger);background:rgba(239,68,68,.15)}
.feedback{padding:12px;border-radius:10px;margin:12px 0}
.feedback.ok{background:rgba(34,197,94,.15);border:1px solid var(--success)}
.feedback.bad{background:rgba(239,68,68,.15);border:1px solid var(--danger)}
.feedback.info{background:rgba(79,157,235,.15);border:1px solid var(--primary)}
.finput{width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text)}
</style>
</head>
<body>
<nav>
  <div class="brand">Math with Mr. Hussein</div>
  <div>
    <button class="navbtn" onclick="


  goHome()">Home</button>
    <button class="navbtn" id="adm-nav" class="hidden">🔐 Teacher</button>
  </div>
</nav>
<div class="container" id="home">
  <div class="hero">
    <h1>Math with Mr. Hussein — Practice Smart. Learn Better. Achieve More.</h1>
    <p class="small">Grades 9–12 & SAT Mathematics</p>
  </div>
  <div class="grid">
    <div class="card" onclick="openGrade(9)"><div class="icon">📚</div><h2>Grade 9</h2></div>
    <div class="card" onclick="openGrade(10)"><div class="icon">🧮</div><h2>Grade 10</h2></div>
    <div class="card" onclick="openGrade(11)"><div class="icon">📐</div><h2>Grade 11</h2></div>
    <div class="card" onclick="openGrade(12)"><div class="icon">🎯</div><h2>Grade 12</h2></div>
    <div class="card" onclick="openSAT()"><div class="icon">SAT</div><h2>Math SAT</h2></div>
  </div>
</div>

<div class="container hidden" id="grade">
  <button class="btn secondary" onclick="


  goHome()">← Home</button>
  <div class="panel">
    <h2 id="gtitle">Grade</h2>
    <div class="row"><button class="btn secondary" data-lvl="Advanced">Advanced</button><button class="btn secondary" data-lvl="General">General</button><button class="btn secondary" data-lvl="ASP">ASP</button></div>
    <div class="row"><button class="btn secondary" data-term="Term 1">Term 1</button><button class="btn secondary" data-term="Term 2">Term 2</button><button class="btn secondary" data-term="Term 3">Term 3</button></div>
    <div class="row"><button class="btn" onclick="gradePractice()">Practice</button><button class="btn" onclick="gradeQuiz()">Quiz</button></div>
    <div class="small" id="gsel"></div>
  </div>
</div>

<div class="container hidden" id="work">
  <button class="btn secondary" onclick="


  goHome()">← Home</button>
  <div class="qcard" id="qwrap"></div>
</div>

<div class="container hidden" id="sat">
  <button class="btn secondary" onclick="


  goHome()">← Home</button>
  <div class="panel">
    <h2>Math SAT</h2>
    <div class="row"><button class="btn" onclick="satPractice()">SAT Practice</button><button class="btn" onclick="satExam()">SAT Exam</button></div>
  </div>
</div>
<script>
function $(id){return document.getElementById(id)}
function show(id){$(id).classList.remove('hidden')}
function hide(id){$(id).classList.add('hidden')}
function 


  goHome(){show('home');hide('grade');hide('work');hide('sat')}
let G={grade:0,lvl:'',term:''}
function openGrade(g){G={grade:g,lvl:'',term:''};$('gtitle').textContent='Grade '+g;show('grade');hide('home');hide('work');hide('sat')}
function openSAT(){show('sat');hide('home');hide('grade');hide('work')}
async function gradePractice(){
  G.mode='practice';
  try{
    const subs = await go('/api/grades/'+G.grade+'/'+encodeURIComponent(G.lvl)+'/'+G.term+'/subtopics');
    G.subs = subs;
    show('subs'); hide('grade'); renderSubs();
  }catch(e){alert(e.message)}
}
function gradeQuiz(){show('work');hide('grade')}
function satPractice(){show('work');hide('sat')}
function satExam(){show('work');hide('sat')}



  goHome()
</script>

<div class="container hidden" id="subs">
  <button class="btn secondary" onclick="goHome()">← Home</button>
  <div class="panel">
    <h2>Select lessons</h2>
    <p class="small">Choose one or more lessons to practice</p>
    <div id="slist"></div>
    <div class="row" style="margin-top:16px"><button class="btn" onclick="startSelected()">Start</button></div>
  </div>
</div>
</body>
</html>
