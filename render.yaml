services:
  - type: web
    name: sat-mathmaster
    runtime: python
    # Starter (not free) so the disk below can keep student accounts and
    # progress across redeploys. Free works too, but its database resets.
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 120 --chdir . wsgi:application
    healthCheckPath: /api/courses
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Teacher sign-in for the Admin page (fix questions/answers).
      # Set BOTH of these in the Render dashboard before your first teacher
      # login, otherwise the site falls back to teacher/teacher.
      - key: TEACHER_USERNAME
        value: teacher
      - key: ADMIN_PASSWORD
        generateValue: true
      # Signs the admin login cookie. CHANGE THIS to any long random string
      # (openssl rand -hex 32), otherwise you are logged out on every restart.
      - key: SECRET_KEY
        generateValue: true
      # Gemini powers answer checking, hints/explanations and "3 more like this"
      # in QuestLearn. Paste your key from https://aistudio.google.com/apikey in
      # the Render dashboard. Without it, only questions with an answer key play.
      - key: GEMINI_API_KEY
        sync: false
      # The database lives on the disk below, so accounts, progress, feedback
      # and admin edits survive redeploys. The first boot copies the bundled
      # question bank onto the disk.
      - key: SAT_DB_PATH
        value: /data/sat.db
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
