services:
  - type: web
    name: sat-mathmaster
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker: live arena fights are kept in that worker's memory. Each fight
    # player holds a thread, hence the many threads.
    startCommand: gunicorn --workers 1 --threads 64 --timeout 120 --chdir . wsgi:application
    healthCheckPath: /api/courses
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Teacher sign-in for the Admin page (fix questions/answers).
      # Set BOTH of these in the Render dashboard before your first teacher
      # login, otherwise the site falls back to teacher/teacher.
      - key: TEACHER_USERNAME
        value: teacher
      - key: ADMIN_PASSWORD
        generateValue: true
      # Signs the admin login cookie. CHANGE THIS to any long random string
      # (openssl rand -hex 32), otherwise you are logged out on every restart.
      - key: SECRET_KEY
        generateValue: true
      # Gemini powers answer checking, hints/explanations and "3 more like this"
      # in QuestLearn. Paste your key from https://aistudio.google.com/apikey in
      # the Render dashboard. Without it, only questions with an answer key play.
      - key: GEMINI_API_KEY
        sync: false
      # Student accounts, progress, the school list, feedback and admin edits
      # are saved in this Postgres database so they survive redeploys. Paste the
      # connection string of a free Neon database (https://neon.tech). Without
      # it they are kept in SQLite, which the free plan resets on every deploy.
      - key: DATABASE_URL
        sync: false
